name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain and target come from rust-toolchain.toml, so CI builds
      # with exactly the nightly the repository is pinned to.
      - name: Install pinned toolchain
        run: rustup show

      - name: Build kernel for RISC-V
        run: cargo build --target riscv64gc-unknown-none-elf

      - name: Build the filesystem crate for the host
        run: cargo build -p ros-fs

  test-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      # .cargo/config.toml defaults to the RISC-V target, which has no test
      # harness, so the host triple has to be named explicitly.
      - name: Run ros-fs tests
        run: cargo test -p ros-fs --target x86_64-unknown-linux-gnu
