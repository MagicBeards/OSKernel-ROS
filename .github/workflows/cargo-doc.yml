name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain and target come from rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup show

      - name: Build API documentation
        run: cargo doc --no-deps --document-private-items

      # Published as a build artifact rather than pushed to a separate Pages
      # repository. The previous workflow deployed to gerrnperl.github.io/ROS666
      # through a personal access token that was never configured here, so it
      # failed on every run since 2026-05. The generated site is still served at
      # that address; this job only verifies the docs keep building.
      - name: Upload API documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/riscv64gc-unknown-none-elf/doc
          if-no-files-found: error
